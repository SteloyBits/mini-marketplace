<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Marketplace - Products</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <section id="products-section" aria-labelledby="products-heading">
            <header class="top-bar">
                <a href="cart.html" id="cart-btn" class="cart-btn" aria-label="Go to cart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 11h14l-1.5 9h-11z" />
                        <path d="M9 11l3-6 3 6" />
                    </svg>
                    <span>Cart</span>
                </a>

                <input type="search" id="search-input" placeholder="Search products..." aria-label="Search products">

                <select id="category-filter" aria-label="Filter by category">
                    <option value="all">All Categories</option>
                </select>
            </header>

            <h1 id="products-heading" class="products-title">Products</h1>

            <p id="products-loading" class="status-message" hidden>Loading products...</p>

            <div id="products-error" class="error-box" hidden>
                <p id="products-error-text">Unable to load products. Please try again.</p>
                <button type="button" id="products-retry-btn">Try Again</button>
            </div>

            <p id="products-empty" class="status-message" hidden>No products match your search.</p>

            <div id="products-grid" class="products-grid"></div>
        </section>
    </main>

    <script src="product.js" defer></script>
    <script src="main.js" defer></script>
</body>

</html>
