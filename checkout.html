<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Marketplace - Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container checkout-container">
    <header class="top-bar">
      <a href="index.html" class="nav-link">← Store</a>
      <span class="page-badge">Secure Checkout</span>
    </header>

    <section class="checkout-card" aria-labelledby="checkout-heading">
      <h1 id="checkout-heading" class="summary-title">Delivery details</h1>
      <p class="summary-subtitle">Enter your details to complete your order.</p>

      <div id="checkout-form-error" class="checkout-alert" role="alert" aria-live="polite" hidden></div>

      <form id="checkout-form" novalidate>
        <div class="form-field">
          <label for="customer-name">Full name</label>
          <input id="customer-name" name="name" type="text" autocomplete="name" required minlength="2" aria-describedby="name-error">
          <small class="field-error" id="name-error"></small>
        </div>
        <div class="form-field">
          <label for="customer-email">Email address</label>
          <input id="customer-email" name="email" type="email" autocomplete="email" required aria-describedby="email-error">
          <small class="field-error" id="email-error"></small>
        </div>
        <div class="form-field">
          <label for="customer-phone">Phone number</label>
          <input id="customer-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="08012345678" required aria-describedby="phone-error">
          <small class="field-error" id="phone-error"></small>
        </div>
        <div class="form-field">
          <label for="customer-address">Delivery address</label>
          <textarea id="customer-address" name="address" rows="3" autocomplete="street-address" required minlength="8" aria-describedby="address-error"></textarea>
          <small class="field-error" id="address-error"></small>
        </div>
        <div class="checkout-total"><span>Order total</span><strong id="checkout-total">₦0.00</strong></div>
        <button class="checkout-submit" type="submit">Place order</button>
      </form>
    </section>
  </main>
  <script src="main.js" defer></script>
  <script src="checkout.js" defer></script>
</body>
</html>
